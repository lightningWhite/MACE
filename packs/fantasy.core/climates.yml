# A climate is two things multiplied. The seasonal `weights` say what a place
# is *like* — an autumn lowland is mostly overcast, with some drizzle in it.
# The `transitions` matrix says how the sky actually *moves* — clear does not
# become blizzard, it becomes overcast, then drizzle, then rain.
#
# The frozen conditions borrow the rows of their unfrozen twins: `light-snow`
# transitions exactly as `rain` does, and `freezesTo` turns the result back
# into snow if it is still cold. That is why one matrix covers a whole year.
climates:

  - id: temperate
    name: "Temperate Lowlands"
    # One step an hour, at the default thirty minutes a tick. Stepping every
    # tick makes the sky twitch; an hour reads like weather.
    stepTicks: 2
    freezingPoint: 0.0
    lapseRate: 0.65

    # One roll per tick across the whole map. Fronts also die when their
    # heading runs out, so on a three-region map they live well short of their
    # lifespan and this needs to be higher than it looks. About one in the air
    # at a time — more than that and none of them mean anything.
    fronts: [westerly, autumn-gale, still-air]
    frontFrequency: 0.04

    seasons:
      - id: spring
        temperature: {min: 4, max: 18}
        weights:
          - {condition: clear, weight: 30}
          - {condition: overcast, weight: 30}
          - {condition: drizzle, weight: 20}
          - {condition: rain, weight: 14}
          - {condition: fog, weight: 5}
          - {condition: storm, weight: 1}
      - id: summer
        temperature: {min: 12, max: 28}
        weights:
          - {condition: clear, weight: 50}
          - {condition: overcast, weight: 22}
          - {condition: drizzle, weight: 10}
          - {condition: rain, weight: 12}
          - {condition: fog, weight: 3}
          - {condition: storm, weight: 3}
      - id: autumn
        temperature: {min: 2, max: 16}
        weights:
          - {condition: clear, weight: 25}
          - {condition: overcast, weight: 30}
          - {condition: drizzle, weight: 20}
          - {condition: rain, weight: 15}
          - {condition: fog, weight: 8}
          - {condition: storm, weight: 2}
      - id: winter
        temperature: {min: -12, max: 3}
        weights:
          - {condition: clear, weight: 20}
          - {condition: overcast, weight: 32}
          - {condition: drizzle, weight: 18}
          - {condition: rain, weight: 20}
          - {condition: fog, weight: 8}
          - {condition: storm, weight: 2}

    transitions:
      - {source: clear, target: clear, weight: 88}
      - {source: clear, target: overcast, weight: 11}
      - {source: clear, target: fog, weight: 1}
      - {source: fog, target: fog, weight: 80}
      - {source: fog, target: overcast, weight: 15}
      - {source: fog, target: clear, weight: 5}
      - {source: overcast, target: overcast, weight: 82}
      - {source: overcast, target: clear, weight: 9}
      - {source: overcast, target: drizzle, weight: 7}
      - {source: overcast, target: rain, weight: 2}
      - {source: drizzle, target: drizzle, weight: 70}
      - {source: drizzle, target: rain, weight: 10}
      - {source: drizzle, target: overcast, weight: 20}
      - {source: rain, target: rain, weight: 74}
      - {source: rain, target: storm, weight: 3}
      - {source: rain, target: drizzle, weight: 13}
      - {source: rain, target: overcast, weight: 10}
      - {source: storm, target: storm, weight: 60}
      - {source: storm, target: rain, weight: 32}
      - {source: storm, target: overcast, weight: 8}
      - {source: sleet, target: drizzle, weight: 70}
      - {source: sleet, target: rain, weight: 10}
      - {source: sleet, target: overcast, weight: 20}
      - {source: light-snow, target: rain, weight: 74}
      - {source: light-snow, target: storm, weight: 3}
      - {source: light-snow, target: drizzle, weight: 13}
      - {source: light-snow, target: overcast, weight: 10}
      - {source: blizzard, target: storm, weight: 60}
      - {source: blizzard, target: rain, weight: 32}
      - {source: blizzard, target: overcast, weight: 8}

  - id: upland
    name: "The High Country"
    # The same weather, a thousand feet up: colder, so far more of it falls as
    # snow, and fog sits in the passes. Nothing here is a new condition — the
    # elevation on the region does the work.
    #
    # `seasons` is a list, and inherited lists replace rather than merge (the
    # same rule every other list field follows) — so unlike the old dict shape,
    # overriding just autumn and winter here means writing out spring and
    # summer too, unchanged from `temperate`, rather than leaving them to be
    # inherited piecemeal.
    extends: temperate
    seasons:
      - id: spring
        temperature: {min: 4, max: 18}
        weights:
          - {condition: clear, weight: 30}
          - {condition: overcast, weight: 30}
          - {condition: drizzle, weight: 20}
          - {condition: rain, weight: 14}
          - {condition: fog, weight: 5}
          - {condition: storm, weight: 1}
      - id: summer
        temperature: {min: 12, max: 28}
        weights:
          - {condition: clear, weight: 50}
          - {condition: overcast, weight: 22}
          - {condition: drizzle, weight: 10}
          - {condition: rain, weight: 12}
          - {condition: fog, weight: 3}
          - {condition: storm, weight: 3}
      - id: autumn
        temperature: {min: -2, max: 11}
        weights:
          - {condition: clear, weight: 20}
          - {condition: overcast, weight: 30}
          - {condition: drizzle, weight: 18}
          - {condition: rain, weight: 18}
          - {condition: fog, weight: 12}
          - {condition: storm, weight: 2}
      - id: winter
        temperature: {min: -20, max: -2}
        weights:
          - {condition: clear, weight: 15}
          - {condition: overcast, weight: 30}
          - {condition: drizzle, weight: 15}
          - {condition: rain, weight: 22}
          - {condition: fog, weight: 10}
          - {condition: storm, weight: 8}
