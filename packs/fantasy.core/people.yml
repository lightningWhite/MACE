# Archetypes to extend. A game pack takes one of these, gives it a name and a
# grudge, and gets on with its story.
entities:

  - id: villager
    kind: actor
    name: "Villager"
    description: "Weathered, unhurried, and entirely uninterested in you."
    tags: [human, villager]
    disposition: friendly
    stats:
      hitpoints: {base: 30, max: 30}
      stamina:   {base: 20, max: 20}
      strength:  {base: 25}
      charisma:  {base: 30}

  - id: travelling-merchant
    kind: actor
    name: "Travelling Merchant"
    description: "A pack, a ledger, and an eye for what you can afford."
    tags: [human, merchant]
    disposition: friendly
    stats:
      hitpoints: {base: 35, max: 35}
      stamina:   {base: 25, max: 25}
      charisma:  {base: 55}

  - id: soldier
    kind: actor
    name: "Soldier"
    description: "Somebody's idea of order, in a padded coat."
    tags: [human, soldier]
    disposition: neutral
    stats:
      hitpoints: {base: 55, max: 55}
      stamina:   {base: 40, max: 40}
      strength:  {base: 55}
      charisma:  {base: 30}

  - id: bridge-troll
    kind: actor
    name: "Bridge Troll"
    description: "Moss in its hair and the patient look of something that gets paid eventually."
    tags: [monster, large, troll]
    disposition: neutral
    stats:
      hitpoints: {base: 80, max: 80}
      stamina:   {base: 60, max: 60}
      strength:  {base: 70}
      speed:     {base: 25}
      charisma:  {base: 10}
    # Responses match on weather *tags*, not on named conditions, so a snow
    # type invented in some other pack three years from now will make this
    # troll harder to see without anyone editing this file.
    env:
      - when: {weatherTag: [dark]}
        modify:
          - {stat: strength, add: 10}
          - {stat: stealth, add: 20}
      - when: {weatherTag: [wet]}
        modify:
          - {stat: strength, add: 8}

  - id: wolf
    kind: actor
    name: "Wolf"
    description: "Long-legged, unhurried, and looking at you the way you look at bread."
    tags: [beast, wolf]
    disposition: hostile
    stats:
      hitpoints: {base: 22, max: 22}
      stamina:   {base: 30, max: 30}
      strength:  {base: 30}
      speed:     {base: 65}
      stealth:   {base: 45}
    env:
      - when: {weatherTag: [cold]}
        modify:
          - {stat: strength, add: 12}
          - {stat: speed, add: 8}
      - when: {dayPart: [dusk, night]}
        modify:
          - {stat: stealth, add: 20}
