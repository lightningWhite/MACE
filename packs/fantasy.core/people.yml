# Archetypes to extend. A game pack takes one of these, gives it a name and a
# grudge, and gets on with its story.
entities:

  - id: villager
    kind: actor
    name: "Villager"
    description: "Weathered, unhurried, and entirely uninterested in you."
    tags: [human, villager]
    disposition: friendly
    combat: {profile: brawler}
    stats:
      hitpoints: {base: 30, max: 30}
      stamina:   {base: 20, max: 20}
      strength:  {base: 25}
      charisma:  {base: 30}

  - id: travelling-merchant
    kind: actor
    name: "Travelling Merchant"
    description: "A pack, a ledger, and an eye for what you can afford."
    tags: [human, merchant]
    disposition: friendly
    combat: {profile: brawler}
    stats:
      hitpoints: {base: 35, max: 35}
      stamina:   {base: 25, max: 25}
      charisma:  {base: 55}

  # A caravan is a market you meet rather than a market you visit. It carries
  # its own prices — anchored to what things are ordinarily worth, because it
  # is not from here and does not know what this valley is short of — and it
  # carries its own stock, which is a pack rather than a shelf.
  #
  # That is the whole of what makes one worth meeting. In a famine the local
  # market prices grain at four times base and the caravan does not, because a
  # shock lands on a place and a caravan is not one.
  - id: salt-carrier
    kind: actor
    name: "A Salt Carrier"
    description: "Three mules, two men, and a load that has come a long way to be here."
    tags: [human, merchant, caravan]
    disposition: neutral
    combat: {profile: brawler}
    stats:
      hitpoints: {base: 30, max: 30}
      stamina:   {base: 25, max: 25}
      charisma:  {base: 45}
    inventory:
      - {item: salt, qty: 40}
      - {item: iron-ingot, qty: 6}
    merchant:
      mobile: true
      wealth: 0.5              # neither desperate nor generous
      spread: 0.3              # the road is a cost, and it is in the spread
      maxSwing: 0.25           # they have all day, and so do you
      patience: 2
      capital: 60
      restockTicks: 240        # they get paid at the other end, eventually
      buys: {categories: [food, metal, cloth]}
      prompt: "See what the carrier is carrying"
      remarks:
        - "\"Salt,\" one of them says, before you have asked. \"And what you have, if it is worth carrying.\""

  - id: soldier
    kind: actor
    name: "Soldier"
    description: "Somebody's idea of order, in a padded coat."
    tags: [human, soldier]
    disposition: neutral
    combat: {profile: shield-line}
    stats:
      hitpoints: {base: 55, max: 55}
      stamina:   {base: 40, max: 40}
      strength:  {base: 55}
      charisma:  {base: 30}

  - id: bridge-troll
    kind: actor
    name: "Bridge Troll"
    description: "Moss in its hair and the patient look of something that gets paid eventually."
    tags: [monster, large, troll]
    disposition: neutral
    combat: {profile: bridge-troll-profile}
    stats:
      hitpoints: {base: 80, max: 80}
      stamina:   {base: 60, max: 60}
      strength:  {base: 70}
      speed:     {base: 25}
      charisma:  {base: 10}
    # Responses match on weather *tags*, not on named conditions, so a snow
    # type invented in some other pack three years from now will make this
    # troll harder to see without anyone editing this file.
    env:
      - when: {weatherTag: [dark]}
        modify:
          - {stat: strength, add: 10}
          - {stat: stealth, add: 20}
      - when: {weatherTag: [wet]}
        modify:
          - {stat: strength, add: 8}

  - id: wolf
    kind: actor
    name: "Wolf"
    description: "Long-legged, unhurried, and looking at you the way you look at bread."
    tags: [beast, wolf]
    disposition: hostile
    combat: {profile: pack-hunter}
    stats:
      hitpoints: {base: 22, max: 22}
      stamina:   {base: 30, max: 30}
      strength:  {base: 30}
      speed:     {base: 65}
      stealth:   {base: 45}
    env:
      - when: {weatherTag: [cold]}
        modify:
          - {stat: strength, add: 12}
          - {stat: speed, add: 8}
      - when: {dayPart: [dusk, night]}
        modify:
          - {stat: stealth, add: 20}
