# `baseValue` is the price anchor. Under `economy: simple` it is the price;
# under `economy: market` a market prices around it. See docs/08-economy.md.
entities:

  - id: gold
    kind: item
    name: "Gold"
    description: "Small, heavy, and never quite enough."
    tags: [currency]
    item: {weight: 0, stackable: true, baseValue: 1}

  - id: bread
    kind: item
    name: "Bread"
    description: "Dense, dark, and a day past its best."
    tags: [food]
    item:
      weight: 1
      stackable: true
      baseValue: 2
      use:
        consumed: true
        effects:
          - {adjustStat: {actor: player, stat: stamina, delta: 6, reason: "bread"}}

  - id: rope
    kind: item
    name: "Rope"
    description: "Forty feet of it, coiled and only slightly frayed."
    tags: [tool]
    item: {weight: 3, stackable: true, baseValue: 6}

  - id: dagger
    kind: item
    name: "Dagger"
    description: "A working knife that has been sharpened into a weapon."
    tags: [weapon]
    item:
      weight: 1
      equipSlot: mainHand
      baseValue: 12
      damage: {min: 2, max: 5, type: pierce}
      # A weapon is how a fighter gets an answer to hold. Carrying a dagger is
      # what makes `parry` one of your options.
      moves: [parry, strike]

  # The traded goods. These are items first: what a market prices is the same
  # sack the player puts in their pack, which is why `goods.yml` names these
  # rather than describing sacks of its own.
  - id: grain
    kind: item
    name: "Grain"
    description: "A sack of barley, threshed and dusty."
    tags: [trade, food]
    item: {weight: 1, stackable: true, baseValue: 4}

  - id: salt
    kind: item
    name: "Salt"
    description: "Coarse grey crystals. Cheap at the coast and never inland."
    tags: [trade, food]
    item: {weight: 1, stackable: true, baseValue: 12}

  - id: iron-ingot
    kind: item
    name: "Iron Ingot"
    description: "A bar of pig iron, heavier than it looks."
    tags: [trade, metal]
    item: {weight: 8, stackable: true, baseValue: 30}

  - id: wool
    kind: item
    name: "Wool"
    description: "A greasy bale, still smelling of the sheep."
    tags: [trade, cloth]
    item: {weight: 4, stackable: true, baseValue: 7}

  - id: healing-draught
    kind: item
    name: "Healing Draught"
    description: "Cloudy, bitter, and worth every coin when it matters."
    tags: [potion]
    item:
      weight: 1
      baseValue: 25
      use:
        consumed: true
        effects:
          - {adjustStat: {actor: player, stat: hitpoints, delta: 15,
                          reason: "healing draught"}}
