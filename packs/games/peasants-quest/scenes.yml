# Scenes are named and flat. Branching is `goto`, the v0 `fallbacks` is `else`,
# and every condition and effect is structured — see ADR-0003.
scenes:

  # ── Fenmoor ───────────────────────────────────────────────────────────────
  - id: fenmoor-arrival
    say:
      - "The geese scatter. Nobody else looks up."
    once: true

  - id: say-goodbye-to-hallam
    prompt: "Say goodbye to Hallam"
    say:
      - "He doesn't say much. He gives you bread, and holds on a moment too long."
      - "\"The Trader's Post is south,\" he says. \"If you've coin, spend it before the road does.\""
    effects:
      - {giveItem: {actor: player, item: fantasy.core:bread, qty: 2}}
      - {setFlag: {entity: old-hallam, flag: has-spoken}}
    once: true

  # ── The Trader's Post ─────────────────────────────────────────────────────
  - id: talk-to-peddler
    prompt: "Talk to the peddler"
    say:
      - "\"Hello, traveller,\" he says, to a man standing in his own county."
      - "\"Bread, rope, and no questions. Everything else went north with the guard.\""
    effects:
      - {setFlag: {entity: peddler, flag: has-spoken}}

  # `economy: simple` means a price is an item's `baseValue` and a trade is
  # what it looks like: take the coin, hand over the goods.
  - id: buy-bread
    prompt: "Buy bread (2 gold)"
    when:
      - {hasItem: {actor: player, item: fantasy.core:gold, qty: 2}}
    say:
      - "He wraps two dark loaves in cloth without being asked twice."
    effects:
      - {takeItem: {actor: player, item: fantasy.core:gold, qty: 2}}
      - {giveItem: {actor: player, item: fantasy.core:bread, qty: 1}}
      - {giveItem: {actor: peddler, item: fantasy.core:gold, qty: 2}}
      - {takeItem: {actor: peddler, item: fantasy.core:bread, qty: 1}}
    else: cannot-afford

  - id: buy-rope
    prompt: "Buy rope (6 gold)"
    when:
      - {hasItem: {actor: player, item: fantasy.core:gold, qty: 6}}
    say:
      - "\"Forty feet,\" he says. \"You'll want it before you want the bread.\""
    effects:
      - {takeItem: {actor: player, item: fantasy.core:gold, qty: 6}}
      - {giveItem: {actor: player, item: fantasy.core:rope, qty: 1}}
      - {giveItem: {actor: peddler, item: fantasy.core:gold, qty: 6}}
      - {takeItem: {actor: peddler, item: fantasy.core:rope, qty: 1}}
    else: cannot-afford

  - id: sell-rope
    prompt: "Sell rope (4 gold)"
    when:
      - {hasItem: {actor: player, item: fantasy.core:rope, qty: 1}}
    say:
      - "He turns it over once, finds the fray, and pays you anyway."
    effects:
      - {takeItem: {actor: player, item: fantasy.core:rope, qty: 1}}
      - {giveItem: {actor: player, item: fantasy.core:gold, qty: 4}}
      - {takeItem: {actor: peddler, item: fantasy.core:gold, qty: 4}}
      - {giveItem: {actor: peddler, item: fantasy.core:rope, qty: 1}}
    else: nothing-to-sell

  - id: sell-reaping-hook
    prompt: "Sell your reaping hook (8 gold)"
    when:
      - {hasItem: {actor: player, item: reaping-hook, qty: 1}}
    say:
      - "\"It's a hook,\" he says, and pays you as though it were not."
      - "You will want it back before the week is out. You take the coin anyway."
    effects:
      - {takeItem: {actor: player, item: reaping-hook, qty: 1}}
      - {giveItem: {actor: player, item: fantasy.core:gold, qty: 8}}
      - {takeItem: {actor: peddler, item: fantasy.core:gold, qty: 8}}
    else: nothing-to-sell

  - id: cannot-afford
    say:
      - "He looks at your hand, and then at your face, and says nothing at all."

  - id: nothing-to-sell
    say:
      - "\"You've nothing I want,\" he says, not unkindly."

  # ── The bridge ────────────────────────────────────────────────────────────
  - id: talk-to-gorm
    prompt: "Speak to the troll"
    when:
      - {flag: {entity: gorm, flag: has-been-paid, is: false}}
    say:
      - "The troll unfolds itself from beneath the bridge, and the bridge seems glad to be rid of the weight."
      - {text: "\"Toll,\" it says. \"Ten gold, or swim.\"", pause: true}
    effects:
      - {setFlag: {entity: gorm, flag: has-spoken}}
    choices:
      - prompt: "Pay the toll (10 gold)"
        when: [{hasItem: {actor: player, item: fantasy.core:gold, qty: 10}}]
        showWhenUnavailable: true
        unavailableHint: "You don't have ten gold."
        goto: pay-the-toll
      - prompt: "Try to talk it down"
        goto: haggle-with-gorm
      - prompt: "Offer it your bread (4 loaves)"
        when: [{hasItem: {actor: player, item: fantasy.core:bread, qty: 4}}]
        showWhenUnavailable: true
        unavailableHint: "You have nothing like four loaves."
        goto: pay-in-bread
      - prompt: "Ask about the road north"
        goto: gorm-on-the-road
    else: gorm-has-been-paid

  - id: pay-the-toll
    say:
      - "The troll counts the coins twice, with evident effort, and steps aside."
    effects:
      - {takeItem: {actor: player, item: fantasy.core:gold, qty: 10}}
      - {giveItem: {actor: gorm, item: fantasy.core:gold, qty: 10}}
      - {setFlag: {entity: gorm, flag: has-been-paid}}
      - {setDisposition: {actor: gorm, to: friendly}}

  - id: pay-in-bread
    say:
      - "You hold out the cloth bundle. The troll considers it for a long, geological moment."
      - "\"Bread,\" it says, as though naming a thing it had forgotten existed, and steps aside."
    effects:
      - {takeItem: {actor: player, item: fantasy.core:bread, qty: 4}}
      - {setFlag: {entity: gorm, flag: has-been-paid}}
      - {setDisposition: {actor: gorm, to: friendly}}

  - id: haggle-with-gorm
    when:
      - {statAtLeast: {actor: player, stat: charisma, value: 40}}
    say:
      - "You point out, reasonably, that you have four gold and no choice."
      - "The troll considers this for a long, geological moment."
      - "\"Four,\" it agrees."
    effects:
      - {takeItem: {actor: player, item: fantasy.core:gold, qty: 4}}
      - {giveItem: {actor: gorm, item: fantasy.core:gold, qty: 4}}
      - {setFlag: {entity: gorm, flag: has-been-paid}}
    else: gorm-refuses-to-haggle

  - id: gorm-refuses-to-haggle
    say:
      - "The troll looks at you the way you look at a goose."
      - "\"Ten,\" it says. \"Or swim.\""

  - id: gorm-on-the-road
    say:
      - "\"Bad,\" says the troll, with feeling. \"Worse at night.\""
      - "\"Something is out in the wood. Not mine.\""
    effects:
      - {setVar: {name: warnedAboutWood, value: true}}

  - id: gorm-has-been-paid
    say:
      - "The troll watches you cross, and goes back to being part of the bridge."

  # ── The castle ────────────────────────────────────────────────────────────
  - id: castle-arrival
    say:
      - "The muster yard is full of men who look as unwilling as you feel. It is a small comfort, and it does not last."
    once: true

  - id: report-to-orin
    prompt: "Report to the captain"
    say:
      - "The captain looks at your hands, then at your face, and writes something down."
      - "\"Late,\" he says. \"But here.\""
    effects:
      - {giveItem: {actor: player, item: kings-token, qty: 1}}
      - {setFlag: {entity: captain-orin, flag: has-spoken}}
    once: true

  # ── Endings — ordinary scenes, no special machinery ────────────────────────
  - id: victory
    say:
      - "You answered the summons. Whatever that turns out to be worth."
      - "The Dark Mountain is nine days north of here, and nobody has said what happens after that."

  - id: defeat
    say:
      - "The road north keeps what it takes."

  # ── Encounters on the north road ──────────────────────────────────────────

  - id: wolves-on-the-road
    visible: false
    say:
      - "Something keeps pace with you in the trees for a hundred yards, and then does not."
      - {text: "You do not see it. You hear it decide against you.", pause: true}

  - id: riders-going-north
    visible: false
    say:
      - "Six riders come up behind you at a trot, in the king's colours, and do not slow down."
      - '"Muster''s at the castle," one calls back. "Walk faster."'

  - id: a-traveller-with-news
    visible: false
    say:
      - {text: "Somebody comes down the road at a pace nobody keeps for pleasure, and stops when they see you.",
         when: {dayPart: [dawn, day, dusk]}}
      - {text: "A shape resolves into a man, walking fast, who starts talking before he is close enough to hear.",
         when: {dayPart: [night]}}
    effects:
      - {tellNews: 1}
