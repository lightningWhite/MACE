# One Entity type covers the player, the people, and the things. `extends`
# takes the shared work from fantasy.core and leaves only what is ours.
entities:

  - id: letholin
    kind: actor
    playable: true
    name: "Letholin"
    description: "Twenty-five years of barley have left you stronger than you look."
    tags: [human, peasant]
    stats:
      hitpoints: {base: 50, max: 50}
      stamina:   {base: 40, max: 40, growth: normal}
      strength:  {base: 32, customizable: true, growth: slow}
      speed:     {base: 41, customizable: true, growth: slow}
      endurance: {base: 30, customizable: true, growth: normal}
      charisma:  {base: 22, customizable: true}
      stealth:   {base: 18, customizable: true}
    combat: {profile: fantasy.core:adventurer}
    inventory:
      - {item: fantasy.core:gold, qty: 4}
      - {item: fantasy.core:bread, qty: 2}
      - {item: reaping-hook, qty: 1}
    equipment:
      mainHand: reaping-hook
    skills:
      reaping-hook: 15

  - id: old-hallam
    extends: fantasy.core:villager
    name: "Old Hallam"
    description: "Your friend, your employer, and the reason you stayed."
    scenes: [say-goodbye-to-hallam]

  - id: peddler
    extends: fantasy.core:travelling-merchant
    name: "The Peddler"
    description: "A stooped man with a pack twice his size and no visible curiosity about where he is."
    inventory:
      - {item: fantasy.core:gold, qty: 30}
      - {item: fantasy.core:bread, qty: 6}
      - {item: fantasy.core:rope, qty: 2}
    scenes: [talk-to-peddler, buy-bread, buy-rope, sell-rope, sell-reaping-hook]
    # He deals for the Post's shelves rather than out of his own pack, which
    # is what makes the price he quotes a fact about the valley: shut the
    # north road and it moves without anybody editing this file. His `spread`
    # is his living, and the reason carrying grain to the castle beats
    # selling it back to him an hour later.
    merchant:
      spread: 0.25
      prompt: "Look over the peddler's stall"
      # He is one man with a pack, so his purse is the thirty gold above and
      # it runs out. It comes back once a day, which is a caravan arriving in
      # everything but name — mobile markets are still to come.
      capital: 30
      restockTicks: 48
      remarks:
        - text: "\"Grain?\" He does not look up. \"You'll pay for grain this week. Nothing's come down the north road since the guard went up it.\""
          when: [{priceOf: {good: fantasy.core:grain, above: 1.4}}]
        - text: "\"Barley,\" he says, with some disgust. \"Everyone's barley. I'll take it, but I'll not pretend to want it.\""
          when: [{priceOf: {good: fantasy.core:grain, below: 0.8}}]
        - text: "\"Iron's dear,\" he says. \"It's always dear. But it's dearer.\""
          when: [{priceOf: {good: fantasy.core:iron-ingot, above: 1.6}}]
        - "\"Have a look,\" he says, and goes back to not looking at you."

  # The two ends of the grain road. Neither of them is a shop: they deal for
  # the shelves of the place they stand in, so Mereth is cheap because the
  # valley grows barley and the quartermaster is dear because a garrison eats
  # it, and the day's walk between them is the whole of the trade.
  - id: mereth-the-reeve
    extends: fantasy.core:villager
    name: "Mereth the Reeve"
    description: "She keeps the village's tally stick and has never once been wrong with it."
    merchant:
      spread: 0.15                 # a neighbour, not a middleman
      prompt: "Deal with Mereth over the barley"
      remarks:
        - text: "\"Take it,\" she says. \"It'll only go stale in the loft.\""
          when: [{priceOf: {good: fantasy.core:grain, below: 0.9}}]
        - text: "\"We're short ourselves,\" she says, and does not offer twice."
          when: [{priceOf: {good: fantasy.core:grain, above: 1.3}}]
        - "She uncovers the sacks with the air of somebody doing you a favour."

  - id: quartermaster-bel
    extends: fantasy.core:soldier
    name: "Quartermaster Bel"
    description: "A ledger, a stub of chalk, and four hundred men to feed by Friday."
    disposition: neutral
    merchant:
      spread: 0.2
      prompt: "Sell to the quartermaster"
      buys: {categories: [food, metal]}
      sells: {goods: [fantasy.core:iron-ingot]}
      # A garrison's chest, not a man's purse: deep, and refilled by whoever
      # is paying for this war.
      capital: 400
      restockTicks: 96
      remarks:
        - text: "\"Grain,\" he says, before you have said anything. \"Whatever you have. Name it.\""
          when: [{priceOf: {good: fantasy.core:grain, above: 1.3}}]
        - text: "\"The road's been kind,\" he says, sounding disappointed about it."
          when: [{priceOf: {good: fantasy.core:grain, below: 1.0}}]
        - "He looks at your hands, then at your pack, then at the ledger."

  - id: gorm
    extends: fantasy.core:bridge-troll
    name: "Gorm"
    description: "It has moss in its hair and the patient look of something that gets paid eventually."
    tags: [$append, named]
    stats:
      strength: {base: 85}
    inventory:
      - {item: fantasy.core:gold, qty: 120}
    scenes: [talk-to-gorm]

  - id: captain-orin
    extends: fantasy.core:soldier
    name: "Captain Orin"
    description: "He looks at your hands before he looks at your face."
    scenes: [report-to-orin]

  - id: reaping-hook
    kind: item
    name: "Reaping Hook"
    description: "Not a weapon. It will have to do."
    tags: [weapon, improvised]
    item:
      weight: 2
      equipSlot: mainHand
      baseValue: 3
      damage: {min: 2, max: 6, type: slash}
      # A billhook is not a weapon and does not teach you to parry with one.
      moves: [fantasy.core:strike]

  - id: kings-token
    kind: item
    name: "The King's Token"
    description: "A lead disc stamped with a crown. Proof you answered the summons."
    tags: [quest]
    item: {weight: 0, stackable: false, baseValue: 0}
