game:
  name: "A Peasant's Quest"
  tagline: "Seven days, one road, no choice."
  authors: ["lightningWhite"]
  difficulty: standard
  estimatedMinutes: 15

  introduction:
    - "You are a peasant. You have worked your old friend's farm for twenty-five years."
    - "One morning, as you cut barley in the low field, a host of the king's guard rides through the standing crop as though it were water."
    - {text: "They tell you the king has called every man between twenty-two and thirty-five to the Dark Mountain. You have seven days to reach Hagan's Castle.", pause: true}

  player:
    entity: letholin
    startLocation: fenmoor
    creationPoints: 15
    backgrounds: [farmhand, poacher, old-soldier]

  world:
    minutesPerTick: 30
    calendar: mace.core:standard-year
    startTick: 20          # mid-morning, day 1
    startSeason: autumn
    startRegion: the-lowlands

  rules:
    vitalPool: hitpoints
    effortPool: stamina
    deathIsPermanent: false
    # `market`, because this pack defines three of them and the whole point
    # of the valley is that grain is cheap where it grows and dear where the
    # garrison eats it. Bread and rope are still bought from the peddler's
    # own scenes: they are items with a price, not goods with a market, and
    # the two ways of selling something sit side by side on purpose.
    economy: market
    currency: fantasy.core:gold

  quests: [the-kings-summons]

  winConditions:
    - {questComplete: the-kings-summons}

  loseConditions:
    - {questFailed: the-kings-summons}
    - {expr: "player.pools.hitpoints.current <= 0"}

  onWin: victory
  onLose: defeat
