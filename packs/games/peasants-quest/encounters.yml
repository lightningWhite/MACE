# The north road's own table. It inherits the quiet-road mix from fantasy.core
# and then makes the road worse: a higher `chance`, and two entries that are
# actually dangerous. `$append` keeps the inherited atmosphere entries, which
# is the point — they are what make the wolves land.
encounterTables:

  - id: forest-road
    extends: fantasy.core:quiet-road
    name: "The North Road"
    chance: 0.30
    minGapTicks: 5
    entries:
      - $append
      - id: wolves-in-the-wood
        weight: 14
        when: [{any: [{dayPart: [dusk, night]}, {weatherTag: [cold]}]}]
        cooldownTicks: 40
        scene: wolves-on-the-road

      # The same wood, in the dark, having made up its mind. A `combat:` entry
      # rather than a scene, because a scene here would only be ceremony.
      - id: wolves-that-mean-it
        weight: 6
        when: [{dayPart: [night]}]
        cooldownTicks: 60
        maxPerGame: 2
        scene: the-wolves-decide-otherwise

      # No scene: a lone wolf in the dark needs no ceremony, and a `combat:`
      # entry is what an author writes when a scene would only be one.
      - id: a-wolf-alone
        weight: 5
        when: [{dayPart: [night]}]
        cooldownTicks: 80
        combat: {against: [fantasy.core:wolf]}

      - id: the-kings-riders
        weight: 8
        once: true
        when: [{dayPart: [dawn, day]}]
        scene: riders-going-north

      # News travels. This entry is only eligible when there is something to
      # tell, so the road stays quiet when nothing has happened.
      - id: someone-with-news
        weight: 25
        when: [{expr: "world.news > 0"}]
        scene: a-traveller-with-news

  - id: the-quiet-track
    extends: fantasy.core:quiet-road
    name: "The Trader's Track"
    chance: 0.12
