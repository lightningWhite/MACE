# The static deployment: the engine compiled to WebAssembly, the worlds beside
# it, and no server anywhere. ADR-0005 is what this is for, and phase 7's
# "a repo full of worlds anyone can play" is why it matters that it is free
# and effectively unkillable.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time, and never cancel one halfway: a half-published
# site is worse than a stale one.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci

      # The site is only worth publishing if the engine in it is the engine
      # the tests passed against.
      - name: Check the content it will ship
        run: mace validate packs/

      - name: Build
        run: npm --prefix web run build
        env:
          # GitHub Pages serves a project site from /<repo>/, so every path
          # the client and the service worker use has to be relative to that.
          BASE_PATH: /${{ github.event.repository.name }}/

      # The claim worth checking before publishing: a playthrough under
      # WebAssembly is the same playthrough as under CPython.
      - name: Play it under WebAssembly
        run: npm --prefix web run check:pyodide

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
