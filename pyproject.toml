[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mace"
version = "0.1.0"
description = "An engine and authoring toolkit for living, text-driven adventure worlds"
readme = "readme.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Daniel Hornberger"}]
keywords = ["text-adventure", "game-engine", "interactive-fiction", "yaml"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Role-Playing",
]

# The engine core must stay importable under Pyodide, so runtime deps are
# stdlib + pydantic only. Neither `mace.engine` nor `mace.model` imports a YAML
# library at all; both of these are content-layer dependencies.
#
# pyyaml reads packs. ruamel.yaml writes them, in round-trip mode, because the
# wizard has to be able to edit somebody's hand-written world without
# flattening the comments that explain it — and a pack whose comments the tool
# eats is a tool people stop using. See mace/content/writing.py.
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
# The session service. An extra, not a runtime dependency: `mace play` and
# `mace author` must keep working on stdlib + pydantic + a YAML reader, and
# the engine has to stay importable under Pyodide, where there is no server
# to run. Nothing under `mace.engine` or `mace.content` may import these.
api = [
    "fastapi>=0.110",
    # [standard] pulls in websockets, without which uvicorn can't upgrade the
    # session stream connection — see mace.api.app's /stream endpoint.
    "uvicorn[standard]>=0.29",
]
dev = [
    "black>=24.0",
    # The service and its test client. The client is httpx-backed, which is
    # why httpx is here and not implied by `api`.
    "fastapi>=0.110",
    "httpx>=0.27",
    # Test-only: proves the generated schemas in `schemas/` actually accept the
    # content they claim to. Never imported by the engine or the content layer.
    "jsonschema>=4.20",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "ruff>=0.5",
    "types-PyYAML",
    "types-jsonschema",
]

[project.scripts]
mace = "mace.cli:main"

[project.urls]
Homepage = "https://github.com/lightningWhite/MACE"
Documentation = "https://github.com/lightningWhite/MACE/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mace*"]

[tool.black]
target-version = ["py312"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]

[tool.mypy]
python_version = "3.12"
# `files`, not `packages` — pre-commit passes explicit filenames, and mypy
# rejects --package together with file arguments.
files = ["src/mace", "tests"]
mypy_path = "src"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
