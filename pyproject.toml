[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mace"
version = "0.1.0"
description = "An engine and authoring toolkit for living, text-driven adventure worlds"
readme = "readme.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Daniel Hornberger"}]
keywords = ["text-adventure", "game-engine", "interactive-fiction", "yaml"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Role-Playing",
]

# The engine core must stay importable under Pyodide, so runtime deps are
# stdlib + pydantic only. pyyaml is a content-layer dependency (pack loading);
# it does not get imported from mace.engine.
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0",
    # Test-only: proves the generated schemas in `schemas/` actually accept the
    # content they claim to. Never imported by the engine or the content layer.
    "jsonschema>=4.20",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "ruff>=0.5",
    "types-PyYAML",
    "types-jsonschema",
]

[project.scripts]
mace = "mace.cli:main"

[project.urls]
Homepage = "https://github.com/lightningWhite/MACE"
Documentation = "https://github.com/lightningWhite/MACE/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mace*"]

[tool.black]
target-version = ["py312"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
# The v0 prototype is scheduled for migration into src/mace/, not cleanup.
"src/wizard.py" = ["ALL"]
"src/modules/**" = ["ALL"]

[tool.mypy]
python_version = "3.12"
# `files`, not `packages` — pre-commit passes explicit filenames, and mypy
# rejects --package together with file arguments.
files = ["src/mace", "tests"]
mypy_path = "src"
strict = true

[[tool.mypy.overrides]]
# The v0 prototype predates type annotations and is being replaced, not typed.
module = ["wizard", "modules.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
